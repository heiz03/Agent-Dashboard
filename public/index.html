<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Dashboard</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><img class="logo" src="icon.svg" alt="" width="28" height="28"><h1>Agents Dashboard</h1><span id="live" class="pill off">Connecting…</span></div>
    <div class="actions">
      <label class="replay" for="replaySel">Replay</label>
      <select id="replaySel"><option value="">Choose a client</option></select>
      <button id="replayBtn" type="button">Play</button>
      <span id="updated" class="muted"></span>
    </div>
  </div>
</header>

<main>
  <section class="canvas-wrap" aria-label="Agent workflow">
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage">
        <svg id="wires" aria-hidden="true"><g id="edges"></g><g id="packets"></g></svg>
        <div id="nodes"></div>
      </div>
    </div>
    <div class="legend">
      <span><i class="sw working"></i>Working</span><span><i class="sw waiting"></i>Waiting</span>
      <span><i class="sw blocked"></i>Blocked</span><span><i class="sw done"></i>Done</span>
      <span><i class="sw idle"></i>Idle</span><span><i class="sw none"></i>Not set up</span>
      <button id="view3d" type="button" class="view-toggle" aria-pressed="true">3D view: on</button>
    </div>
  </section>

  <section class="panel" aria-label="What each agent is doing right now">
    <div class="panel-head"><h2>Live now</h2><span class="muted">Client · section · what it's reading</span></div>
    <div id="now"></div>
  </section>

  <section id="blockers" aria-live="polite"></section>

  <section aria-labelledby="agents-h">
    <div class="section-head"><h2 id="agents-h">Agents</h2><div class="filters" id="filters" role="toolbar" aria-label="Filter agents"></div></div>
    <div id="cards" class="cards"></div>
  </section>

  <section id="detail"></section>

  <div class="two-col">
    <section class="panel">
      <div class="panel-head"><h2>Clients by agent</h2><span id="ready" class="muted"></span></div>
      <div class="table-wrap"><table id="grid"></table></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Activity</h2><span class="muted">Newest first</span></div>
      <div id="feed" class="feed"></div>
    </section>
  </div>
  <p class="foot muted" id="foot"></p>
</main>

<script src="canvas.js"></script>
<script src="app.js"></script>
</body>
</html>
