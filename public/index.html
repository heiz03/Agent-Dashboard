<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">◎</span><h1>Agents Dashboard</h1><span id="live" class="pill off">Connecting…</span></div>
  <div class="actions">
    <label class="replay">Replay
      <select id="replaySel"><option value="">a client's run…</option></select>
    </label>
    <button id="replayBtn" type="button">Play</button>
    <span id="updated" class="muted"></span>
  </div>
</header>

<main>
  <section class="canvas-wrap" aria-label="Agent workflow canvas">
    <div class="canvas-scroll">
    <svg id="canvas" viewBox="0 0 1200 372" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Agents and the wires between them">
      <defs>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="dot-grid"/></pattern>
      </defs>
      <rect width="1200" height="372" fill="url(#dots)"/>
      <g id="edges"></g><g id="packets"></g><g id="nodes"></g>
    </svg>
    </div>
    <div class="legend">
      <span><i class="sw working"></i>Working</span><span><i class="sw waiting"></i>Waiting</span>
      <span><i class="sw blocked"></i>Blocked</span><span><i class="sw done"></i>Done</span>
      <span><i class="sw idle"></i>Idle</span><span><i class="sw none"></i>Not set up</span>
    </div>
  </section>

  <section class="panel now-panel" aria-label="What each agent is doing right now">
    <div class="panel-head"><h2>Live now</h2><span class="muted">client · section · what it is reading</span></div>
    <div id="now"></div>
  </section>

  <section id="blockers" aria-live="polite"></section>

  <div class="filters" id="filters" role="toolbar" aria-label="Filter agents"></div>
  <section id="cards" class="cards"></section>

  <section id="detail"></section>

  <div class="two-col">
    <section class="panel">
      <div class="panel-head"><h2>Clients by agent</h2><span id="ready" class="muted"></span></div>
      <div class="table-wrap"><table id="grid"></table></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Activity</h2><span class="muted">newest first</span></div>
      <div id="feed" class="feed"></div>
    </section>
  </div>
  <p class="foot muted" id="foot"></p>
</main>

<script src="canvas.js"></script>
<script src="app.js"></script>
</body>
</html>
