<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Command Center</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" width="28" height="28">
      <div>
        <h1>Agent command center</h1>
        <div class="sub"><span id="liveDot" class="live-dot off"></span><span id="liveText">Connecting…</span></div>
      </div>
    </div>
    <div class="stats" id="stats" aria-live="off"></div>
    <div class="clocks">
      <div><span>Pacific</span><b id="clockPT">--</b></div>
      <div><span>Philippines</span><b id="clockPH">--</b></div>
    </div>
  </div>
</header>

<main>
  <section id="alerts" class="alerts" aria-live="polite" aria-label="Needs attention"></section>

  <div class="row">
    <section class="wall" aria-labelledby="wall-h">
      <div class="section-head">
        <h2 id="wall-h">Agents and sessions</h2>
        <span class="muted" id="wallNote">Click a tile for details</span>
      </div>
      <div id="tiles" class="tiles"></div>
    </section>

    <section class="panel log-panel" aria-labelledby="log-h">
      <div class="panel-head">
        <h2 id="log-h">Live log</h2>
        <button type="button" id="pauseBtn" class="small">Pause</button>
      </div>
      <div class="chips" id="chips" role="toolbar" aria-label="Filter the log"></div>
      <div id="log" class="log"></div>
    </section>
  </div>

  <div class="row">
    <section class="panel map-panel" aria-labelledby="map-h">
      <div class="panel-head">
        <h2 id="map-h">Who's talking to whom</h2>
        <span class="replay-box">
          <label for="replaySel" class="muted">Replay</label>
          <select id="replaySel"><option value="">Choose a client</option></select>
          <button id="replayBtn" type="button" class="small">Play</button>
        </span>
      </div>
      <div class="map-wrap"><svg id="map" role="img" aria-label="Agents and the wires between them"></svg></div>
    </section>

    <section class="panel tl-panel" aria-labelledby="tl-h">
      <div class="panel-head">
        <h2 id="tl-h">Last 4 hours</h2>
        <span class="legend" id="tlLegend"></span>
      </div>
      <div class="tl-wrap"><div id="timeline" class="timeline"></div></div>
    </section>
  </div>

  <details class="panel clients-panel">
    <summary><h2>Client results</h2><span class="muted" id="ready"></span></summary>
    <div class="table-wrap"><table id="grid"></table></div>
  </details>

  <p class="foot muted" id="foot"></p>
</main>

<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" aria-label="Details" hidden></aside>

<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
